[build]
  functions = "netlify/functions"
  publish = "."

[functions]
  node_bundler = "esbuild"
[[edge_functions]]
  path = "/*"
  function = "rate-limit"
# Cache static pages at the CDN so floods mostly hit cache, not origin
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=60, s-maxage=300"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=60, s-maxage=300"

# Security headers on every response
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# Never cache API/auth endpoints
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/*.php"
  [headers.values]
    Cache-Control = "no-store"
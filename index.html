<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex, nofollow, noarchive"/>
  <title>Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #111111;
      --surface: #1a1a1a;
      --border: #2e2e2e;
      --text: #f0f0f0;
      --muted: #666;
      --accent: #f0f0f0;
      --error: #f87171;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'IBM Plex Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .course-tag {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-align: center;
      margin-bottom: 40px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 40px;
      width: 100%;
      max-width: 380px;
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 32px;
      color: var(--text);
    }

    .field { margin-bottom: 18px; }

    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 11px 14px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus { border-color: #555; }
    input::placeholder { color: #444; }

    .error-msg {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--error);
      margin-top: 8px;
      display: none;
    }
    .error-msg.show { display: block; }

    .attempts-msg {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
      display: none;
    }
    .attempts-msg.show { display: block; }
    .attempts-msg.low { color: var(--error); }

    .lockout-box {
      display: none;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      color: var(--error);
      background: rgba(248,113,113,0.08);
      border: 1px solid rgba(248,113,113,0.35);
      padding: 10px 12px;
      margin-top: 8px;
      text-align: center;
    }
    .lockout-box.show { display: block; }

    button[type="submit"] {
      width: 100%;
      margin-top: 10px;
      background: var(--text);
      color: var(--bg);
      border: none;
      padding: 13px;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
      letter-spacing: 0.03em;
    }
    button[type="submit"]:hover { opacity: 0.85; }
    button[type="submit"]:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-signup {
      width: 100%;
      margin-top: 14px;
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 11px;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      letter-spacing: 0.03em;
    }
    .btn-signup:hover { border-color: #555; background: rgba(255,255,255,0.05); }

    .spinner {
      display: none;
      width: 14px; height: 14px;
      border: 2px solid rgba(0,0,0,0.2);
      border-top-color: #000;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center; padding: 24px; }
    .modal.show { display: flex; }
    .modal-content { background: var(--surface); border: 1px solid var(--border); padding: 40px; width: 100%; max-width: 380px; position: relative; }
    .modal-close { position: absolute; top: 16px; right: 16px; background: none; border: none; color: var(--muted); font-size: 24px; cursor: pointer; padding: 0; width: 24px; height: 24px; line-height: 1; }
    .modal-close:hover { color: var(--text); }

    .created-by {
      margin-top: 20px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="course-tag">IT 002-IT41S3 - Information Assurance and Security 2</div>

  <div class="card">
    <h1>Sign in</h1>


    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="username" autocomplete="username"/>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="password" autocomplete="current-password"/>
      <div class="error-msg" id="error-msg">Invalid username or password.</div>
      <div class="attempts-msg" id="attempts-msg"></div>
    </div>

    <div class="lockout-box" id="lockout-box"></div>

    <button type="submit" id="login-btn" onclick="handleLogin()">
      <span id="btn-text">Sign in</span>
      <div class="spinner" id="spinner"></div>
    </button>
    <button type="button" class="btn-signup" onclick="openSignupModal()">Create Account</button>
  </div>

  <div class="modal" id="signup-modal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeSignupModal()">×</button>
      <h1>Create Account</h1>
      <div class="field">
        <label for="signup-username">Username</label>
        <input type="text" id="signup-username" placeholder="username" autocomplete="off"/>
      </div>
      <div class="field">
        <label for="signup-password">Password</label>
        <input type="password" id="signup-password" placeholder="password" autocomplete="off"/>
        <div class="error-msg" id="signup-error-msg"></div>
      </div>
      <button type="submit" id="signup-btn" onclick="handleSignup()">
        <span id="signup-btn-text">Create Account</span>
        <div class="spinner" id="signup-spinner"></div>
      </button>
    </div>
  </div>

  <div class="created-by">created by — Group 7</div>

  <script>
    function openSignupModal() {
      document.getElementById('signup-modal').classList.add('show');
      document.getElementById('signup-username').focus();
    }
    function closeSignupModal() {
      document.getElementById('signup-modal').classList.remove('show');
      document.getElementById('signup-username').value = '';
      document.getElementById('signup-password').value = '';
      document.getElementById('signup-error-msg').textContent = '';
      document.getElementById('signup-error-msg').classList.remove('show');
    }

    let lockoutTimer = null;

    function fmtTime(s) {
      const m = Math.floor(s / 60);
      const sec = s % 60;
      return m > 0 ? `${m}:${String(sec).padStart(2, '0')}` : `${sec}s`;
    }

    function updateAttemptsMsg(remaining) {
      const el = document.getElementById('attempts-msg');
      if (remaining === undefined || remaining === null) {
        el.classList.remove('show');
        return;
      }
      el.textContent = `${remaining} attempt${remaining === 1 ? '' : 's'} remaining`;
      el.classList.toggle('low', remaining <= 2);
      el.classList.add('show');
    }

    function startLockoutCountdown(seconds, locked) {
      const box = document.getElementById('lockout-box');
      const btn = document.getElementById('login-btn');
      let remaining = seconds;
      btn.disabled = true;
      box.classList.add('show');
      if (lockoutTimer) clearInterval(lockoutTimer);

      const label = locked ? 'Account locked' : 'Please wait';
      const render = () => {
        box.textContent = `${label} — try again in ${fmtTime(remaining)}`;
      };
      render();

      lockoutTimer = setInterval(() => {
        remaining--;
        if (remaining <= 0) {
          clearInterval(lockoutTimer);
          lockoutTimer = null;
          box.classList.remove('show');
          btn.disabled = false;
        } else {
          render();
        }
      }, 1000);
    }

    async function handleLogin() {
      if (lockoutTimer) return;

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('login-btn');
      const btnText = document.getElementById('btn-text');
      const spinner = document.getElementById('spinner');
      const errorMsg = document.getElementById('error-msg');
      errorMsg.classList.remove('show');
      btn.disabled = true; btnText.style.display = 'none'; spinner.style.display = 'block';
      try {
        const res = await fetch('login.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({ username, password })
        });
        const data = await res.json();

        if (data.success) {
          updateAttemptsMsg(null);
          sessionStorage.setItem('auth_token', data.token);
          sessionStorage.setItem('auth_user', username);
          sessionStorage.setItem('auth_privilege', data.privilege || 'user');
          window.location.href = 'home.html';
          return;
        }

        errorMsg.textContent = data.error || 'Invalid username or password.';
        errorMsg.classList.add('show');

        if (typeof data.attempts_remaining === 'number') {
          updateAttemptsMsg(data.attempts_remaining);
        }

        if (data.retry_after) {
          if (data.locked) updateAttemptsMsg(0);
          startLockoutCountdown(data.retry_after, !!data.locked);
        } else {
          btn.disabled = false;
        }
      } catch (e) {
        errorMsg.textContent = 'Connection error. Please try again.';
        errorMsg.classList.add('show');
        btn.disabled = false;
      } finally {
        btnText.style.display = 'block'; spinner.style.display = 'none';
      }
    }

    async function handleSignup() {
      const username = document.getElementById('signup-username').value.trim();
      const password = document.getElementById('signup-password').value;
      const btn = document.getElementById('signup-btn');
      const btnText = document.getElementById('signup-btn-text');
      const spinner = document.getElementById('signup-spinner');
      const errorMsg = document.getElementById('signup-error-msg');
      errorMsg.classList.remove('show');
      btn.disabled = true; btnText.style.display = 'none'; spinner.style.display = 'block';
      try {
        const res = await fetch('register.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({ username, password })
        });
        const data = await res.json();
        if (data.success) {
          closeSignupModal();
          document.getElementById('error-msg').textContent = 'Account created! Sign in now.';
          document.getElementById('error-msg').classList.add('show');
          document.getElementById('username').focus();
        } else {
          errorMsg.textContent = data.error || 'Registration failed.';
          errorMsg.classList.add('show');
        }
      } catch (e) {
        errorMsg.textContent = 'Connection error. Please try again.';
        errorMsg.classList.add('show');
      } finally {
        btn.disabled = false; btnText.style.display = 'block'; spinner.style.display = 'none';
      }
    }

    document.addEventListener('keydown', e => { if (e.key === 'Enter' && !document.getElementById('signup-modal').classList.contains('show')) handleLogin(); });
    document.getElementById('signup-password').addEventListener('keydown', e => { if (e.key === 'Enter' && document.getElementById('signup-modal').classList.contains('show')) handleSignup(); });
  </script>
</body>
</html>
